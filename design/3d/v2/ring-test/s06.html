<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Stillway V2 S06 test</title>
<style>
  /* Reference implementation of design/3d/v2/s06-pose.json by 3D Designer. Not production code. */
  html, body { margin: 0; height: 100%; background: #F7F5F0; overflow: hidden; font: 12px/1.4 system-ui, sans-serif; }
  .plinth { position: fixed; left: 0; right: 0; bottom: 0; height: 30vh; background: #EFE6DB; }
  .hand { position: fixed; right: 10vw; bottom: 0; height: 94vh; opacity: 0; }
  .hand img { height: 100%; display: block; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; }
  .hud { position: fixed; left: 12px; top: 12px; color: #231F20; }
  .hud input { width: 320px; }
</style>
</head>
<body>
<div class="plinth" id="plinth"></div>
<div class="hand" id="hand"><img id="handImg" src="hand/A-1-hand-left-alpha.png" alt="" /></div>
<canvas id="c"></canvas>
<div class="hud" id="hud">p <input type="range" id="p" min="0" max="1" step="0.001" /> <span id="pv"></span></div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { EXRLoader } from 'three/addons/loaders/EXRLoader.js';

const q = new URLSearchParams(location.search);
if (q.has('nohud')) document.getElementById('hud').style.display = 'none';
const S = await (await fetch('../s06-pose.json')).json();
const F = await (await fetch('../finishes.json')).json();
const D2R = THREE.MathUtils.degToRad, clamp = THREE.MathUtils.clamp;
const AX = { x: new THREE.Vector3(1, 0, 0), y: new THREE.Vector3(0, 1, 0), z: new THREE.Vector3(0, 0, 1) };
function poseQ(steps) { // world-space steps in order: q = Rn ... R1
  const out = new THREE.Quaternion();
  for (const [a, deg] of steps) out.premultiply(new THREE.Quaternion().setFromAxisAngle(AX[a], D2R(deg)));
  return out;
}

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.AgXToneMapping;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 1, 20000);
const tex = await new EXRLoader().loadAsync('../' + F.envPresets.paper.file);
tex.mapping = THREE.EquirectangularReflectionMapping;
scene.environment = new THREE.PMREMGenerator(renderer).fromEquirectangular(tex).texture;
scene.environmentIntensity = q.has('env') ? +q.get('env') : 0.85;

const draco = new DRACOLoader().setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/gltf/');
const ring = (await new GLTFLoader().setDRACOLoader(draco).loadAsync('../stillway-ring-v2-silver_web.glb')).scene;
ring.traverse((o) => { if (o.isMesh) o.renderOrder = 1; });
scene.add(ring);

// finger proxy (depth only)
const prof = S.fingerProxy.profile.map(([r, y]) => new THREE.Vector2(r, y)).reverse();
const proxyMat = q.has('proxy')
  ? new THREE.MeshBasicMaterial({ color: 0xff0044, transparent: true, opacity: 0.35, side: THREE.DoubleSide })
  : new THREE.MeshBasicMaterial({ colorWrite: false, side: THREE.DoubleSide });
const proxy = new THREE.Mesh(new THREE.LatheGeometry(prof, 48), proxyMat);
proxy.renderOrder = 0; scene.add(proxy);

const P = { front: poseQ(S.poses.frontLogoTop.steps), side: poseQ(S.poses.side.steps), edge: poseQ(S.poses.edge45.steps), finger: poseQ(S.poses.onFinger.steps) };
const proxyQ = poseQ([['z', S.image.axisTiltDeg]]); // proxy and slide path stay in the photo plane (no 10 deg tilt -> no parallax drift)
const fingerAxis = new THREE.Vector3(0, 1, 0).applyQuaternion(proxyQ);

let W, H;
function resize() {
  W = innerWidth; H = innerHeight;
  renderer.setSize(W, H, false);
  camera.aspect = W / H; camera.fov = 30;
  camera.position.set(0, 0, (H / 2) / Math.tan(D2R(15))); // 1 unit = 1 css px at z = 0
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
const toWorld = (x, y) => new THREE.Vector3(x - W / 2, H / 2 - y, 0);

const ease = { p2o: (t) => 1 - (1 - t) ** 2, p2io: (t) => (t < .5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2), sio: (t) => -(Math.cos(Math.PI * t) - 1) / 2 };
const seg = (p, a, b) => clamp((p - a) / (b - a), 0, 1);
const tmpQ = new THREE.Quaternion();

function update(p) {
  const img = document.getElementById('handImg').getBoundingClientRect();
  const k = img.width / S.image.size[0];                       // img px -> css px
  const seat = toWorld(img.left + S.image.ringSeat[0] * k, img.top + S.image.ringSeat[1] * k);
  const dFinger = S.ring.onFingerOuterDiameterImgPx * k;
  const dRoll = H * S.rolling.ringDiameterVh / 100;
  const R = dRoll / 2;
  const floorY = H * 0.70;                                    // top of the plinth
  const xStop = W * 0.40, xStart = -R, dist = xStop - xStart; // distanceVw ~ 55 on desktop is xStop - xStart in vw
  document.getElementById('hand').style.opacity = String(seg(p, 0.67, 0.75));

  // proxy follows the photo
  proxy.position.copy(seat); proxy.quaternion.copy(proxyQ); proxy.scale.setScalar(k);
  proxy.visible = p > 0.67;

  let pos, quat = new THREE.Quaternion(), diam = dRoll;
  if (p <= 0.25) { // rolling
    let x;
    if (p <= 0.22) x = xStart + (dist + 0.06 * R) * ease.p2o(p / 0.22);
    else x = xStop + 0.06 * R * (1 - ease.sio(seg(p, 0.22, 0.25)));
    pos = toWorld(x, floorY - R);
    quat = poseQ([['z', 90 - THREE.MathUtils.radToDeg((x - xStop) / R)]]);
  } else if (p <= 0.67) {
    pos = toWorld(xStop, floorY - R);
    if (p <= 0.40) quat.slerpQuaternions(P.front, P.side, ease.sio(seg(p, 0.25, 0.40)));
    else if (p <= 0.50) quat.copy(P.side);
    else quat.slerpQuaternions(P.side, P.edge, ease.sio(seg(p, 0.50, 0.67)));
  } else {
    const L = (S.image.ringSeat[1] - S.image.fingerTip[1] + 40) * k / Math.cos(D2R(S.image.axisTiltDeg)); // seat -> 40 img px above tip
    const above = seat.clone().addScaledVector(fingerAxis, L);
    if (p <= 0.80) {
      const t = ease.sio(seg(p, 0.67, 0.80));
      pos = toWorld(xStop, floorY - R).lerp(above, t);
      quat.slerpQuaternions(P.edge, P.finger, t);
      diam = THREE.MathUtils.lerp(dRoll, dFinger, t);
    } else {
      pos = above.lerp(seat, ease.p2io(seg(p, 0.80, 1.0)));
      quat.copy(P.finger); diam = dFinger;
    }
  }
  if (p > 0.67) { // view correction: keep the logo facing the camera wherever the hand sits on screen
    const d = camera.position.z - pos.z, w = seg(p, 0.67, 0.80);
    const corr = poseQ([['x', THREE.MathUtils.radToDeg(Math.atan2(pos.y, d)) * w], ['y', THREE.MathUtils.radToDeg(Math.atan2(-pos.x, d)) * w]]);
    quat.premultiply(corr);
    if (q.has('yaw')) quat.premultiply(poseQ([['y', +q.get('yaw')]]));
  }
  ring.position.copy(pos); ring.quaternion.copy(quat); ring.scale.setScalar(diam / S.ring.glbOuterDiameterM);
  document.getElementById('pv').textContent = p.toFixed(3);
}

const slider = document.getElementById('p');
let p = q.has('p') ? +q.get('p') : 1; slider.value = p;
slider.oninput = () => (p = +slider.value);
await document.getElementById('handImg').decode();
renderer.setAnimationLoop(() => { update(p); renderer.render(scene, camera); });
if (q.has('dbg')) { update(p); ring.updateMatrixWorld(true);
  let eng; ring.traverse((o) => { if (o.isMesh && o.material.name === 'Ring_Silver_Engrave') eng = o; });
  const b = new THREE.Box3().setFromObject(eng), c = b.getCenter(new THREE.Vector3());
  const lc = new THREE.Box3().setFromBufferAttribute(eng.geometry.attributes.position).getCenter(new THREE.Vector3());
  const toCam = camera.position.clone().sub(ring.position).normalize(), n = c.clone().sub(ring.position).normalize();
  document.title += ' DBG local=' + lc.toArray().map(v=>v.toFixed(4)) + ' angleToCamDeg=' + THREE.MathUtils.radToDeg(Math.atan2(n.x, n.z) - Math.atan2(toCam.x, toCam.z)).toFixed(1); }
document.title += ' · ready';
const m = document.createElement('div'); m.id = 'msg'; m.textContent = 'ready'; m.style.display = 'none'; document.body.append(m);
</script>
</body>
</html>
